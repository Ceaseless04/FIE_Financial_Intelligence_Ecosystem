[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fie-observability"
version = "0.1.0"
description = "Structured logging, tracing, and metrics for the FIE platform"
requires-python = ">=3.11"
dependencies = [
    "fie-common",
    "structlog>=24.4",
    "opentelemetry-api>=1.27",
    "opentelemetry-sdk>=1.27",
]

[tool.hatch.build.targets.wheel]
packages = ["src/fie_observability"]
