[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fie-database"
version = "0.1.0"
description = "PostgreSQL, Redis, and Neo4j infrastructure for the FIE platform"
requires-python = ">=3.11"
dependencies = [
    "fie-common",
    "fie-observability",
    "fie-schemas",
    "SQLAlchemy[asyncio]>=2.0.32",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "redis>=5.0",
    "neo4j>=5.24",
]

[tool.hatch.build.targets.wheel]
packages = ["src/fie_database"]
