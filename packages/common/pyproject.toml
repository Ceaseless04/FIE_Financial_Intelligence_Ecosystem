[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fie-common"
version = "0.1.0"
description = "Shared configuration, error hierarchy, and resilience primitives for the FIE platform"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
]

[tool.hatch.build.targets.wheel]
packages = ["src/fie_common"]
