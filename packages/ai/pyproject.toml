[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fie-ai"
version = "0.1.0"
description = "Provider-neutral AI abstraction (Claude, Ollama, vLLM) for the FIE platform"
requires-python = ">=3.11"
dependencies = [
    "fie-common",
    "fie-observability",
    "fie-schemas",
    "httpx>=0.27",
]

[project.optional-dependencies]
claude = ["anthropic>=0.40"]
all = ["anthropic>=0.40"]

[tool.hatch.build.targets.wheel]
packages = ["src/fie_ai"]
