[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fie-finance"
version = "0.1.0"
description = "Currency-safe decimal money and fiscal period primitives"
requires-python = ">=3.11"
dependencies = [
    "fie-common",
    "fie-schemas",
    "pydantic>=2.8",
]

[tool.hatch.build.targets.wheel]
packages = ["src/fie_finance"]
