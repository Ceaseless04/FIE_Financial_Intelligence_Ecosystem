name: CI

# The pull-request quality gate. Every stage must pass before merge:
#
#   lint -> format -> typecheck -> unit -> integration -> security -> coverage -> docker
#
# Integration tests run against real service containers, and FIE_REQUIRE_INFRA=1
# turns a missing service into a failure rather than a silent skip — otherwise
# a broken container would look like a green build.

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"
  FIE_ENVIRONMENT: test

permissions:
  contents: read

jobs:
  static-analysis:
    name: Lint, format, and type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install --no-deps -e packages/common -e packages/observability \
            -e packages/schemas -e packages/ai -e packages/auth \
            -e packages/database -e packages/events -e packages/testing \
            -e apps/marketmind -e apps/atlas

      - name: Lint
        run: ruff check .

      - name: Formatting
        run: ruff format --check .

      - name: Type check
        # Target paths come from `files` in pyproject.toml.
        run: mypy

  test:
    name: Unit, integration, and coverage
    runs-on: ubuntu-latest
    needs: static-analysis

    services:
      postgres:
        # pgvector, not stock postgres: MarketMind's chunk store declares a
        # `vector` column, and `CREATE EXTENSION vector` fails on the plain image.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: fie
          POSTGRES_PASSWORD: fie-local-development
          POSTGRES_DB: fie
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U fie -d fie"
          --health-interval 5s --health-timeout 5s --health-retries 12

      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 12

      neo4j:
        image: neo4j:5-community
        env:
          NEO4J_AUTH: neo4j/fie-local-development
        ports: ["7687:7687", "7474:7474"]
        options: >-
          --health-cmd "wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1"
          --health-interval 10s --health-timeout 5s --health-retries 20
          --health-start-period 30s

    env:
      # A service container that failed to start must fail the run rather than
      # skip silently. Named explicitly rather than "1" because no model server
      # runs here — live-provider tests are meant to skip, and demanding them
      # would redden every PR while proving nothing about this change.
      FIE_REQUIRE_INFRA: "postgres,redis,neo4j"
      FIE_POSTGRES_HOST: localhost
      FIE_POSTGRES_PASSWORD: fie-local-development
      FIE_REDIS_HOST: localhost
      FIE_NEO4J_URI: bolt://localhost:7687
      FIE_NEO4J_PASSWORD: fie-local-development

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install --no-deps -e packages/common -e packages/observability \
            -e packages/schemas -e packages/ai -e packages/auth \
            -e packages/database -e packages/events -e packages/testing \
            -e apps/marketmind -e apps/atlas

      - name: Unit tests
        run: pytest packages apps -m unit -q --junitxml=junit-unit.xml

      - name: Integration tests
        run: pytest packages apps -m integration -q --junitxml=junit-integration.xml

      - name: API contract tests
        run: pytest apps -m api -q --junitxml=junit-api.xml

      - name: MarketMind migrations apply cleanly
        # A migration that only ever runs via metadata.create_all in tests is a
        # migration nobody has actually executed. `check` additionally fails when
        # the models have drifted from the migration history.
        working-directory: apps/marketmind
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head
          alembic check

      - name: Atlas migrations apply cleanly
        # Run after MarketMind's so both histories coexist in one database —
        # which is the arrangement the namespaced version tables exist for, and
        # the one a shared alembic_version table would break.
        working-directory: apps/atlas
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head
          alembic check

      - name: Full suite with coverage gate
        # fail_under = 90 lives in pyproject.toml; this step enforces it.
        run: pytest packages apps --cov --cov-report=xml --cov-report=term-missing -q

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            junit-*.xml
            coverage.xml
          retention-days: 14

  security:
    name: Security and dependency scan
    runs-on: ubuntu-latest
    needs: static-analysis
    permissions:
      contents: read
      security-events: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install scanners
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit bandit[toml]

      - name: Dependency vulnerability scan
        run: pip-audit --requirement requirements-dev.txt --strict

      - name: Static security scan
        # Bandit rules are also enforced inline by ruff's S ruleset; this is the
        # dedicated pass that fails the build on high-severity findings.
        run: bandit -r packages apps -ll -x "*/tests/*"

      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker:
    name: Container build and scan
    runs-on: ubuntu-latest
    needs: [test, security]

    steps:
      - uses: actions/checkout@v4

      - name: Validate compose files
        run: |
          docker compose -f docker-compose.dev.yml config --quiet
          # Production compose requires every secret to be present; supply
          # throwaway values so the file's structure is still validated.
          FIE_POSTGRES_USER=ci FIE_POSTGRES_PASSWORD=ci-validation-password-value \
          FIE_POSTGRES_DATABASE=fie FIE_REDIS_PASSWORD=ci-validation-password-value \
          FIE_NEO4J_USER=neo4j FIE_NEO4J_PASSWORD=ci-validation-password-value \
          NEO4J_ACCEPT_LICENSE_AGREEMENT=yes FIE_DOMAIN=example.invalid \
          OTEL_EXPORTER_ENDPOINT=otel.example.invalid:4317 \
          FIE_AUTH_JWT_SECRET=ci-validation-jwt-secret-value-32ch \
          FIE_CLAUDE_API_KEY=sk-ant-ci-validation \
          MARKETMIND_EMBEDDING_BASE_URL=http://embeddings.internal:8000 \
          ATLAS_MARKETMIND_TOKEN=ci-validation-service-token \
            docker compose -f docker-compose.prod.yml config --quiet

      - name: Build platform image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infrastructure/docker/Dockerfile.platform
          push: false
          load: true
          tags: fie/platform:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build MarketMind image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infrastructure/docker/Dockerfile.marketmind
          push: false
          load: true
          tags: fie/marketmind:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Atlas image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infrastructure/docker/Dockerfile.atlas
          push: false
          load: true
          tags: fie/atlas:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan images for vulnerabilities
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: fie/platform:ci
          format: table
          exit-code: "1"
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      - name: Scan MarketMind image for vulnerabilities
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: fie/marketmind:ci
          format: table
          exit-code: "1"
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      - name: Scan Atlas image for vulnerabilities
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: fie/atlas:ci
          format: table
          exit-code: "1"
          severity: CRITICAL,HIGH
          ignore-unfixed: true

  gate:
    name: Quality gate
    runs-on: ubuntu-latest
    needs: [static-analysis, test, security, docker]
    if: always()
    steps:
      - name: Verify every required stage passed
        run: |
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = "true" ]; then
            echo "One or more required stages failed — blocking merge."
            exit 1
          fi
          echo "All quality gates passed."
